trigger:
  - master

pool:
  vmImage: ubuntu-latest

stages:
  # STAGE 1: Build the WAR
  - stage: Build
    displayName: 'Build'
    jobs:
      - job: BuildWar
        displayName: 'Maven package'
        steps:
          - task: Maven@4
            displayName: 'mvn clean package'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean package'
              options: '-B -U'
              publishJUnitResults: false
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.17'
              mavenVersionOption: 'Default'

          # Updated step targeting the webapp module output directory
          - task: PublishPipelineArtifact@1
            displayName: 'Publish WAR'
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/webapp/target/'
              artifact: 'war-drop'
              publishLocation: 'pipeline'